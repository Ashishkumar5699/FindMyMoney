<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Dark blue background with rounded corners -->
    <rect x="0" y="0" width="456" height="456" rx="90" fill="#1A237E"/>

    <!-- Gold coin circle -->
    <circle cx="228" cy="210" r="130" fill="#FFD600"/>
    <circle cx="228" cy="210" r="110" fill="none" stroke="#F9A825" stroke-width="10"/>

    <!-- Rupee symbol -->
    <text x="228" y="260" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="150" font-weight="bold" fill="#1A237E">₹</text>

    <!-- Bottom tagline bar -->
    <rect x="60" y="370" width="336" height="50" rx="10" fill="#FFFFFF" opacity="0.15"/>
    <text x="228" y="404" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="22" font-weight="bold" fill="#FFFFFF" letter-spacing="2">FindMyMoney</text>
</svg>
