<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect x="0" y="0" width="456" height="456" fill="#1A237E"/>

    <!-- Outer glow ring -->
    <circle cx="228" cy="190" r="108" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.2"/>

    <!-- Gold coin -->
    <circle cx="228" cy="190" r="90" fill="#FFD600"/>
    <circle cx="228" cy="190" r="74" fill="none" stroke="#F9A825" stroke-width="8"/>

    <!-- Rupee symbol on coin -->
    <text x="228" y="228" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="110" font-weight="bold" fill="#1A237E">₹</text>

    <!-- App name -->
    <text x="228" y="330" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="34" font-weight="bold" fill="#FFFFFF">FindMyMoney</text>

    <!-- Tagline -->
    <text x="228" y="360" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="14" fill="#90CAF9">TRACK  ·  SAVE  ·  GROW</text>
</svg>
