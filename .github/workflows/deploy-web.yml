name: Build & Deploy Web

on:
  push:
    branches: [Stable, PreProduction]
  workflow_dispatch:

jobs:
  # ── Flutter web ────────────────────────────────────────────────────────────
  deploy-flutter:
    name: Flutter Web → Vercel
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: team_UtKuX5197XYDwbUS3o7wmqXO
      VERCEL_PROJECT_ID: prj_pZDOohEXxapqYp79fZhbNuBR86M1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: Flutter

      - name: Build web
        run: flutter build web --release
        working-directory: Flutter

      - name: Copy vercel.json into build output
        run: cp Flutter/vercel.json Flutter/build/web/vercel.json

      - name: Deploy to Vercel (production)
        if: github.ref == 'refs/heads/Stable'
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: Flutter/build/web

      - name: Deploy to Vercel (preview / dev)
        if: github.ref == 'refs/heads/PreProduction'
        run: npx vercel --token ${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: Flutter/build/web

  # ── Next.js web ────────────────────────────────────────────────────────────
  deploy-nextjs:
    name: Next.js Web → Vercel
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: team_UtKuX5197XYDwbUS3o7wmqXO
      VERCEL_PROJECT_ID: prj_gqvQyMAT2JYTA6IH2EKucVWIj18S

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        if: github.ref == 'refs/heads/Stable'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_WEB_TOKEN }}
          AI_CORE_URL: ${{ secrets.PNJB_AI_CORE_URL }}
          AI_PLATFORM_KEY: ${{ secrets.PNJB_AI_PLATFORM_KEY }}
        run: |
          npx vercel@latest --prod \
            --env PNJB_AI_CORE_URL="$AI_CORE_URL" \
            --env PNJB_AI_PLATFORM_KEY="$AI_PLATFORM_KEY" \
            --token "$VERCEL_TOKEN" \
            --yes

      - name: Deploy to Vercel (preview / dev)
        if: github.ref == 'refs/heads/PreProduction'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_WEB_TOKEN }}
          AI_CORE_URL: ${{ secrets.PNJB_AI_CORE_URL }}
          AI_PLATFORM_KEY: ${{ secrets.PNJB_AI_PLATFORM_KEY }}
        run: |
          npx vercel@latest \
            --env PNJB_AI_CORE_URL="$AI_CORE_URL" \
            --env PNJB_AI_PLATFORM_KEY="$AI_PLATFORM_KEY" \
            --token "$VERCEL_TOKEN" \
            --yes
