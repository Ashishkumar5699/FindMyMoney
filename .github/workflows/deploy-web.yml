name: Build & Deploy Web

on:
  push:
    branches: [Stable]

jobs:
  deploy:
    name: Flutter Web → Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: Flutter

      - name: Build web
        run: flutter build web --release
        working-directory: Flutter

      - name: Copy vercel.json into build output
        run: cp Flutter/vercel.json Flutter/build/web/vercel.json

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_UtKuX5197XYDwbUS3o7wmqXO
          vercel-project-id: prj_pZDOohEXxapqYp79fZhbNuBR86M1
          working-directory: Flutter/build/web
          vercel-args: '--prod'
