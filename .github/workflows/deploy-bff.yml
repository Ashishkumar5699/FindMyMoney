name: Build & Deploy BFF

on:
  push:
    branches: [Stable, PreProduction]
    paths: ['BFF/**']

jobs:
  deploy:
    name: NestJS BFF → Vercel
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: team_UtKuX5197XYDwbUS3o7wmqXO
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BFF_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BFF/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: BFF

      - name: Build
        run: npm run build
        working-directory: BFF

      - name: Deploy (production)
        if: github.ref == 'refs/heads/Stable'
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: BFF

      - name: Deploy (preview)
        if: github.ref == 'refs/heads/PreProduction'
        run: npx vercel --token ${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: BFF
