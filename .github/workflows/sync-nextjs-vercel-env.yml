name: Deploy Next.js (Web)

# Deploys findmymoney-web to Vercel, injecting AI env vars from GitHub Secrets
# at deployment time. To update the AI server URL: change PNJB_AI_CORE_URL in
# GitHub Secrets → push to Stable (or trigger manually) → new deployment picks it up.
on:
  push:
    branches: [Stable]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy → Vercel (Next.js)
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: team_UtKuX5197XYDwbUS3o7wmqXO
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel with AI env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          AI_CORE_URL: ${{ secrets.PNJB_AI_CORE_URL }}
          AI_PLATFORM_KEY: ${{ secrets.PNJB_AI_PLATFORM_KEY }}
        run: |
          npx vercel@latest --prod \
            --env PNJB_AI_CORE_URL="$AI_CORE_URL" \
            --env PNJB_AI_PLATFORM_KEY="$AI_PLATFORM_KEY" \
            --token "$VERCEL_TOKEN" \
            --yes
