name: Sync Next.js Vercel Env

# Run whenever Stable is updated, or trigger manually to push a new server URL.
# To update the AI server URL: update PNJB_AI_CORE_URL in GitHub Secrets, then
# run this workflow via Actions → "Run workflow".
on:
  push:
    branches: [Stable]
  workflow_dispatch:

jobs:
  sync-env:
    name: Upsert AI env vars → Vercel (Next.js)
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: prj_gqvQyMAT2JYTA6IH2EKucVWIj18S
      TEAM_ID: team_UtKuX5197XYDwbUS3o7wmqXO

    steps:
      - uses: actions/checkout@v4

      # Use Vercel REST API directly — no CLI project-linking needed.
      # All endpoints require ?teamId for team-owned projects.
      - name: Upsert PNJB_AI_CORE_URL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VALUE: ${{ secrets.PNJB_AI_CORE_URL }}
        run: |
          BASE="https://api.vercel.com/v9/projects/$PROJECT_ID/env"
          QUERY="teamId=$TEAM_ID"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"

          # List existing env vars to find the ID of PNJB_AI_CORE_URL (if present)
          RESP=$(curl -sf "$BASE?$QUERY" -H "$AUTH" || echo '{}')
          ENV_ID=$(echo "$RESP" | jq -r '(.envs // [])[] | select(.key == "PNJB_AI_CORE_URL") | .id' | head -1)

          # Delete existing entry if found
          if [ -n "$ENV_ID" ]; then
            echo "Deleting existing env $ENV_ID"
            curl -sf -X DELETE "$BASE/$ENV_ID?$QUERY" -H "$AUTH"
          fi

          # Create new entry
          BODY=$(jq -n --arg v "$VALUE" \
            '{key:"PNJB_AI_CORE_URL",value:$v,type:"plain",target:["production"]}')
          curl -sf -X POST "$BASE?$QUERY" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d "$BODY"
          echo "PNJB_AI_CORE_URL set."

      - name: Upsert PNJB_AI_PLATFORM_KEY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VALUE: ${{ secrets.PNJB_AI_PLATFORM_KEY }}
        run: |
          BASE="https://api.vercel.com/v9/projects/$PROJECT_ID/env"
          QUERY="teamId=$TEAM_ID"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"

          RESP=$(curl -sf "$BASE?$QUERY" -H "$AUTH" || echo '{}')
          ENV_ID=$(echo "$RESP" | jq -r '(.envs // [])[] | select(.key == "PNJB_AI_PLATFORM_KEY") | .id' | head -1)

          if [ -n "$ENV_ID" ]; then
            echo "Deleting existing env $ENV_ID"
            curl -sf -X DELETE "$BASE/$ENV_ID?$QUERY" -H "$AUTH"
          fi

          BODY=$(jq -n --arg v "$VALUE" \
            '{key:"PNJB_AI_PLATFORM_KEY",value:$v,type:"plain",target:["production"]}')
          curl -sf -X POST "$BASE?$QUERY" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d "$BODY"
          echo "PNJB_AI_PLATFORM_KEY set."

      - name: Deploy Next.js (production)
        if: github.ref == 'refs/heads/Stable'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_UtKuX5197XYDwbUS3o7wmqXO
          VERCEL_PROJECT_ID: prj_gqvQyMAT2JYTA6IH2EKucVWIj18S
        working-directory: Web
        run: npx vercel@latest --prod --token "$VERCEL_TOKEN" --yes
