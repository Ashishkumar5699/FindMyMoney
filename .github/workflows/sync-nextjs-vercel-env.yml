name: Sync Next.js Vercel Env

# Run whenever Stable is updated, or trigger manually to push a new server URL.
# To update the AI server URL: update PNJB_AI_CORE_URL in GitHub Secrets, then
# run this workflow via Actions → "Run workflow".
on:
  push:
    branches: [Stable]
  workflow_dispatch:

jobs:
  sync-env:
    name: Upsert AI env vars → Vercel (Next.js)
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: team_UtKuX5197XYDwbUS3o7wmqXO

    steps:
      - uses: actions/checkout@v4

      # Create .vercel/project.json so the CLI knows which project to target.
      # Project ID confirmed from Web/.vercel/project.json (findmymoney-web, Next.js).
      - name: Link Vercel project (Next.js)
        run: |
          mkdir -p Web/.vercel
          echo '{"projectId":"prj_gqvQyMAT2JYTA6IH2EKucVWIj18S","orgId":"team_UtKuX5197XYDwbUS3o7wmqXO"}' \
            > Web/.vercel/project.json

      - name: Upsert PNJB_AI_CORE_URL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VALUE: ${{ secrets.PNJB_AI_CORE_URL }}
        working-directory: Web
        run: |
          npx vercel@latest env rm PNJB_AI_CORE_URL production \
            --token "$VERCEL_TOKEN" --yes 2>/dev/null || true
          echo "$VALUE" | npx vercel@latest env add PNJB_AI_CORE_URL production \
            --token "$VERCEL_TOKEN" --yes

      - name: Upsert PNJB_AI_PLATFORM_KEY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VALUE: ${{ secrets.PNJB_AI_PLATFORM_KEY }}
        working-directory: Web
        run: |
          npx vercel@latest env rm PNJB_AI_PLATFORM_KEY production \
            --token "$VERCEL_TOKEN" --yes 2>/dev/null || true
          echo "$VALUE" | npx vercel@latest env add PNJB_AI_PLATFORM_KEY production \
            --token "$VERCEL_TOKEN" --yes

      - name: Deploy Next.js (production)
        if: github.ref == 'refs/heads/Stable'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: Web
        run: npx vercel@latest --prod --token "$VERCEL_TOKEN" --yes
