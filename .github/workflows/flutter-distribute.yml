name: Flutter — Firebase App Distribution

on:
  push:
    branches: [Stable]
  workflow_dispatch:

jobs:
  distribute:
    name: Build APK & distribute to testers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      # Inject google-services.json from secret (stored as base64)
      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > Flutter/android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get
        working-directory: Flutter

      # Debug-signed APK — fine for App Distribution; swap for release keystore when going to Play Store
      - name: Build APK
        run: flutter build apk --debug
        working-directory: Flutter

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          testers: ${{ secrets.FIREBASE_TESTERS }}
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
          file: Flutter/build/app/outputs/flutter-apk/app-debug.apk
