name: Flutter — Firebase App Distribution

on:
  push:
    branches: [Stable]
    paths:
      - 'Flutter/**'
      - '.github/workflows/flutter-distribute.yml'
  workflow_dispatch:

jobs:
  distribute:
    name: Build APK & distribute to testers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      # Inject google-services.json from secret (stored as base64)
      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > Flutter/android/app/google-services.json

      # Inject release keystore from secret (stored as base64)
      - name: Write keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > Flutter/android/app/findmymoney.jks

      - name: Install dependencies
        run: flutter pub get
        working-directory: Flutter

      # telephony 0.2.0 is discontinued — missing namespace (AGP 8+) and
      # kotlinOptions jvmTarget (must match compileOptions Java target = 11).
      # Patch its build.gradle directly in the pub cache before Gradle evaluates it.
      - name: Patch telephony for AGP 8+ compatibility
        run: |
          BUILD=$(find ~/.pub-cache -name "build.gradle" -path "*/telephony-0.2.0/android/*" 2>/dev/null | head -1)
          if [ -n "$BUILD" ]; then
            printf "\nandroid { namespace 'com.shounakmulay.telephony'; compileSdkVersion 35; kotlinOptions { jvmTarget = '11' } }\n" >> "$BUILD"
            echo "Patched $BUILD"
          else
            echo "telephony build.gradle not found — skipping patch"
          fi

      - name: Build APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number=${{ github.run_number }}
        working-directory: Flutter
        env:
          KEYSTORE_PATH: findmymoney.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          testers: ${{ secrets.FIREBASE_TESTERS }}
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
          file: Flutter/build/app/outputs/flutter-apk/app-release.apk
