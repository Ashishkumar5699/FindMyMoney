name: Deploy → Production

on:
  push:
    branches: [Stable]
  workflow_dispatch:

jobs:
  # ── Detect which apps changed ────────────────────────────────────────────────
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nextjs: ${{ steps.filter.outputs.nextjs }}
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nextjs:
              - 'Web/**'
              - '.github/workflows/deploy-production.yml'
            flutter:
              - 'Flutter/**'
              - '.github/workflows/deploy-production.yml'

  # ── Next.js production deploy ────────────────────────────────────────────────
  deploy-nextjs:
    name: Next.js → Vercel (production)
    needs: detect
    if: needs.detect.outputs.nextjs == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_UtKuX5197XYDwbUS3o7wmqXO
      VERCEL_PROJECT_ID: prj_gqvQyMAT2JYTA6IH2EKucVWIj18S
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_WEB_TOKEN }}
          AI_CORE_URL: ${{ secrets.PNJB_AI_CORE_URL }}
          AI_PLATFORM_KEY: ${{ secrets.PNJB_AI_PLATFORM_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          npx vercel@65.4.0 --prod \
            --env PNJB_AI_CORE_URL="$AI_CORE_URL" \
            --env PNJB_AI_PLATFORM_KEY="$AI_PLATFORM_KEY" \
            --env GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --env GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            --token "$VERCEL_TOKEN" \
            --yes

  # ── Flutter production deploy ────────────────────────────────────────────────
  deploy-flutter:
    name: Flutter → Vercel (production)
    needs: detect
    if: needs.detect.outputs.flutter == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_UtKuX5197XYDwbUS3o7wmqXO
      VERCEL_PROJECT_ID: prj_pZDOohEXxapqYp79fZhbNuBR86M1
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: Flutter

      - name: Build web
        run: flutter build web --release
        working-directory: Flutter

      - name: Copy vercel.json into build output
        run: cp Flutter/vercel.json Flutter/build/web/vercel.json

      - name: Deploy to Vercel (production)
        run: npx vercel@65.4.0 --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: Flutter/build/web
