name: findmymoney
description: "FindMyMoney - Personal Finance Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client
  dio: ^5.8.0

  # Secure storage for JWT token
  flutter_secure_storage: ^9.2.4

  # Navigation
  go_router: ^14.8.1

  # State management
  flutter_riverpod: ^2.6.1

  # Date formatting
  intl: ^0.20.2

  # SMS reading (Android only)
  telephony: ^0.2.0

  # Permissions
  permission_handler: ^11.3.1

  # Local database for pending SMS queue
  sqflite: ^2.4.2
  path: ^1.9.0

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Peer loans: QR code display + scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0

  # Peer loans: share 6-digit code via WhatsApp/SMS
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
