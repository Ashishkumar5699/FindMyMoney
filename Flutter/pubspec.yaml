name: findmymoney
description: "FindMyMoney - Personal Finance Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client
  dio: ^5.8.0

  # Secure storage for JWT token
  flutter_secure_storage: ^9.2.4

  # Navigation
  go_router: ^14.8.1

  # State management
  flutter_riverpod: ^2.6.1

  # Date formatting
  intl: ^0.20.2

  # SMS reading (Android only)
  telephony: ^0.2.0

  # Permissions
  permission_handler: ^11.3.1

  # Local database for pending SMS queue
  sqflite: ^2.4.2
  path: ^1.9.0

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # ── DrinkUp module dependencies ───────────────────────────────────────────────
  # State management (DrinkUp uses Provider; FMM uses Riverpod — both coexist)
  provider: ^6.1.2

  # Biometric unlock (Face ID / fingerprint for DrinkUp MPIN)
  local_auth: ^2.3.0

  # Map + location (DrinkUp friend-location sharing)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Image picking + compression (DrinkUp profile photos)
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # MPIN input UI
  pin_code_fields: ^8.0.1

  # Timezone (DrinkUp scheduled notifications)
  timezone: ^0.9.4

  # URL launcher (DrinkUp phone/link handling)
  url_launcher: ^6.3.1

  # Firebase (DrinkUp FCM push notifications — requires google-services.json)
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/drinkup/images/
    - assets/drinkup/icons/
